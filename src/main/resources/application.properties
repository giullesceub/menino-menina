# Configurações do Banco H2 em memória
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:estoquedb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=admin
quarkus.datasource.password=admin
quarkus.http.port=${PORT:8080}

# Recriar o schema e os dados de demonstração a cada inicialização da aplicação
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Permitir o frontend local; configurar CORS_ORIGINS com a URL publicada do frontend no deploy
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept