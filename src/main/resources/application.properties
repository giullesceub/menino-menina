# Banco descartável para desenvolvimento local e testes automatizados.
# Não é necessário instalar o H2: o driver e o banco em memória vêm pelo Maven.
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:estoquedb;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:estoquedb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

# PostgreSQL persistente do Supabase, usado pelo Render no perfil prod.
# O Quarkus lê diretamente QUARKUS_DATASOURCE_DB_KIND, QUARKUS_DATASOURCE_JDBC_URL,
# QUARKUS_DATASOURCE_USERNAME e QUARKUS_DATASOURCE_PASSWORD do ambiente.

quarkus.http.port=${PORT:8080}

# O H2 é recriado e recebe dados de demonstração somente fora do perfil prod.
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# No Supabase, o schema.sql é aplicado manualmente no SQL Editor.
# A aplicação apenas valida o schema existente e nunca apaga/recria dados.
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file

# Permitir o frontend local; configurar CORS_ORIGINS com a URL publicada do frontend no deploy
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,PUT,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept
